schema_version: "1.1"
name: plan-draft-load-2
runs: 1
execution:
  prompt: "Check this draft of TR items against the armory task check."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: plan-draft-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-draft"'
    min: 1
