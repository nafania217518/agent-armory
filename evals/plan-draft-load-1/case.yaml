schema_version: "1.1"
name: plan-draft-load-1
runs: 1
execution:
  prompt: "Which checks must the armory planner run on its draft before it reports?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: plan-draft-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-draft"'
    min: 1
