schema_version: "1.1"
name: review-load-1
runs: 1
execution:
  prompt: "Review this diff before I merge it."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: review-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?review"'
    min: 1
