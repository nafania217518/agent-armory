schema_version: "1.1"
name: test-skip-1
runs: 1
execution:
  prompt: "Spawn an agent to write the release notes."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: test-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test"'
    min: 0
    max: 0
