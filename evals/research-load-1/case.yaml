schema_version: "1.1"
name: research-load-1
runs: 1
execution:
  prompt: "Check the docs: does React strict mode still run effect cleanup twice?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: research-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?research"'
    min: 1
