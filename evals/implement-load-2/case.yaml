schema_version: "1.1"
name: implement-load-2
runs: 1
execution:
  prompt: "What are the armory coder's rules for the smallest complete change?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: implement-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implement"'
    min: 1
