schema_version: "1.1"
name: core-main-skip-1
runs: 1
execution:
  prompt: "Which model and effort does armory pick for a coder spawn?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: core-main-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?core-main"'
    min: 0
    max: 0
