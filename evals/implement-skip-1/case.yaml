schema_version: "1.1"
name: implement-skip-1
runs: 1
execution:
  prompt: "Explain what the login form component does."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: implement-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?implement"'
    min: 0
    max: 0
