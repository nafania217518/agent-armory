schema_version: "1.1"
name: debug-load-3
runs: 1
execution:
  prompt: "Prod returns a 500 on /orders since yesterday's deploy and the cause is unknown."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: debug-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?debug"'
    min: 1
