schema_version: "1.1"
name: plan-draft-skip-1
runs: 1
execution:
  prompt: "Plan a milestone for the billing export feature."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: plan-draft-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?plan-draft"'
    min: 0
    max: 0
