schema_version: "1.1"
name: delegate-skip-1
runs: 1
execution:
  prompt: "Write a brief summary of what the last commit changed."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: delegate-not-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?delegate"'
    min: 0
    max: 0
