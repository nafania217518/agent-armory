schema_version: "1.1"
name: audit-load-2
runs: 1
execution:
  prompt: "What can I delete from this repo? Find the bloat."
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: audit-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?audit"'
    min: 1
