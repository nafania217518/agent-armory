schema_version: "1.1"
name: delegate-load-1
runs: 1
execution:
  prompt: "Which model should I use for the coder agent on this task?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: delegate-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?delegate"'
    min: 1
