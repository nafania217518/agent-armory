schema_version: "1.1"
name: test-load-2
runs: 1
execution:
  prompt: "What are the armory test rules for req: markers?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: test-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test"'
    min: 1
