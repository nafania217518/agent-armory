schema_version: "1.1"
name: test-load-3
runs: 1
execution:
  prompt: "Before I write tests here, which test levels and unit style apply?"
  max_turns: 3
  allowed_tools: [Skill, Read, Glob, Grep]
graders:
  - name: test-loaded
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?test"'
    min: 1
